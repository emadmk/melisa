# Nginx Configuration for Kerman Hatef Ertebat
# کرمان هاتف ارتباط
#
# Copy this file to: /etc/nginx/sites-available/hatefertebat.ir
# Then: sudo ln -s /etc/nginx/sites-available/hatefertebat.ir /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Upstream for Next.js app
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hatefertebat.ir www.hatefertebat.ir;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hatefertebat.ir www.hatefertebat.ir;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/hatefertebat.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hatefertebat.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Logging
    access_log /var/www/hatef/logs/nginx-access.log;
    error_log /var/www/hatef/logs/nginx-error.log;

    # Root directory
    root /var/www/hatef/app/public;

    # Static files caching
    location /_next/static {
        alias /var/www/hatef/app/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /images {
        alias /var/www/hatef/app/public/images;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /uploads {
        alias /var/www/hatef/uploads;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Static files
    location /favicon.ico {
        expires 30d;
        access_log off;
    }

    location /robots.txt {
        expires 7d;
        access_log off;
    }

    location /sitemap.xml {
        expires 1d;
        access_log off;
    }

    # API rate limiting
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin panel (more strict rate limiting)
    location /admin {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js app
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Block common attack patterns
    location ~* (\.env|\.git|\.htaccess|\.htpasswd|\.bak|\.backup|\.sql)$ {
        deny all;
        return 404;
    }

    # Block wp-admin and other WordPress paths (we migrated away)
    location ~* (wp-admin|wp-content|wp-includes|xmlrpc\.php|wp-login\.php) {
        return 301 https://$server_name/;
    }
}
